# PebbleKit Android 2 and its transitively required Jetpack libraries use AndroidX.
# Without this setting AGP rejects :app:debugRuntimeClasspath before Kotlin compilation.
android.useAndroidX=true

# Keep Gradle JVM memory bounded for desktop and CI builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin 2.4 metadata is required by PebbleKit2 1.3.2's Kotlin stdlib.
# Override AGP 9.1's built-in Kotlin 2.2 compiler with Kotlin 2.4.20.
android.builtInKotlin=false

# AGP 9 new DSL is incompatible with external Kotlin Gradle plugin 2.4.
android.newDsl=false
