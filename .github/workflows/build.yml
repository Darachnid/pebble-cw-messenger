name: Pebble CW Messenger SMS beta

on:
  push:
    branches: [feature/android-sms-bridge]
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble CLI
        run: |
          uv tool install --python 3.13 pebble-tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install SDK and Clay
        run: |
          pebble sdk install latest
          pebble package install @rebble/clay
      - name: Build Time 2 PBW
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: cw-messenger-sms-beta-watch
          path: build/pebble-cw-messenger.pbw

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile companion APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cw-messenger-sms-beta-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
