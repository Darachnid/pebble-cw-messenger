name: Android SMS Companion Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-sms-bridge
    paths:
      - 'android/**'
      - '.github/workflows/android-sms-debug.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build companion debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cw-sms-bridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
